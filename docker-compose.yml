services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password
      POSTGRES_DB: grocery_analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d grocery_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/grocery_compare}
      ANALYTICS_DATABASE_URL: postgresql://analytics_user:analytics_password@postgres:5432/grocery_analytics
      PORT: 3000
      FRONTEND_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRES_IN: 1d
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo-data:
  postgres-data:
