openapi: 3.0.3

info:
  title: Grocery Compare API
  version: 1.0.0
  description: API for comparing grocery prices across shops.

servers:
  - url: http://localhost:3000
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Service and database health information
  - name: Authentication
    description: User registration and JWT authentication
  - name: Products
    description: Grocery product operations

paths:
  /health:
    get:
      security: []
      operationId: getHealth
      tags:
        - Health
      summary: Check API and database health
      responses:
        "200":
          description: API and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/register:
    post:
      security: []
      operationId: registerUser
      tags:
        - Authentication
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/InvalidAuthData"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      security: []
      operationId: loginUser
      tags:
        - Authentication
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/InvalidAuthData"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Authentication
      summary: Get the authenticated user
      responses:
        "200":
          description: Authenticated user returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: API is running but database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /products:
    get:
      operationId: listProducts
      tags:
        - Products
      summary: Get products
      parameters:
        - name: name
          in: query
          required: false
          description: Search products by name
          schema:
            type: string
          example: milk
        - name: shop
          in: query
          required: false
          description: Filter products by shop; can be used without a product name
          schema:
            type: string
          example: Coop
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of products per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Products returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductsResponse"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createProduct
      tags:
        - Products
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
            example:
              name: Arla Milk 1L
              shop: ICA
              price: 10.9
              unit: 1L
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCreatedResponse"
        "400":
          $ref: "#/components/responses/InvalidProductData"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/cheapest:
    get:
      operationId: getCheapestProducts
      tags:
        - Products
      summary: Find the cheapest matching products
      parameters:
        - name: name
          in: query
          required: true
          description: Product name to search for
          schema:
            type: string
          example: milk
      responses:
        "200":
          description: Cheapest products returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          description: Product name is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No matching products found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: MongoDB product ID
        schema:
          type: string
        example: 64f1a2b3c4d5e6f789012345

    get:
      operationId: getProductById
      tags:
        - Products
      summary: Get a product by ID
      responses:
        "200":
          description: Product returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/InvalidProductId"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: updateProductPrice
      tags:
        - Products
      summary: Update a product price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceInput"
            example:
              price: 12.5
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductUpdatedResponse"
        "400":
          description: Invalid product ID or price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: patchProductPrice
      tags:
        - Products
      summary: Patch a product price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceInput"
            example:
              price: 12.5
      responses:
        "200":
          description: Product price updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductUpdatedResponse"
        "400":
          description: Invalid product ID or price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteProduct
      tags:
        - Products
      summary: Delete a product
      responses:
        "200":
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/InvalidProductId"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123

    AuthResponse:
      type: object
      required:
        - user
        - token
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          example: 64f1a2b3c4d5e6f789012345
        email:
          type: string
          format: email
          example: test@example.com

    CurrentUserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"

    Product:
      type: object
      required:
        - _id
        - name
        - shop
        - price
        - unit
      properties:
        _id:
          type: string
          example: 64f1a2b3c4d5e6f789012345
        name:
          type: string
          example: Arla Milk 1L
        shop:
          type: string
          example: ICA
        price:
          type: number
          format: float
          minimum: 0
          example: 10.9
        unit:
          type: string
          example: 1L

    ProductInput:
      type: object
      required:
        - name
        - shop
        - price
        - unit
      properties:
        name:
          type: string
          example: Arla Milk 1L
        shop:
          type: string
          example: ICA
        price:
          type: number
          format: float
          minimum: 0
          example: 10.9
        unit:
          type: string
          example: 1L

    PaginatedProductsResponse:
      type: object
      required:
        - items
        - page
        - limit
        - total
        - pages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0

    PriceInput:
      type: object
      required:
        - price
      properties:
        price:
          type: number
          format: float
          minimum: 0
          example: 12.5

    Error:
      type: object
      required:
        - message
        - error
      properties:
        message:
          type: string
          example: Invalid product data
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              example: INVALID_REQUEST
            message:
              type: string
              example: Invalid product data
            requestId:
              type: string
              format: uuid

    HealthResponse:
      type: object
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: ok
        database:
          type: string
          enum:
            - connected
            - disconnected
          example: connected

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Product deleted successfully

    ProductCreatedResponse:
      type: object
      required:
        - message
        - product
      properties:
        message:
          type: string
          example: Product created successfully
        product:
          $ref: "#/components/schemas/Product"

    ProductUpdatedResponse:
      type: object
      required:
        - message
        - product
      properties:
        message:
          type: string
          example: Product updated successfully
        product:
          $ref: "#/components/schemas/Product"

  responses:
    InvalidAuthData:
      description: Invalid email or password data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication is required or the token is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidProductData:
      description: Invalid product data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidQuery:
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidProductId:
      description: Invalid product ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ProductNotFound:
      description: Product not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
