name: Container security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  scan-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build --tag grocery-compare-backend:ci backend

      - name: Build frontend image
        run: docker build --tag grocery-compare-frontend:ci --build-arg VITE_API_URL=http://localhost:3000 frontend

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan backend image
        run: |
          trivy image --format table --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs /usr/lib/node_modules/npm \
            --exit-code 1 grocery-compare-backend:ci

      - name: Scan frontend image
        run: |
          trivy image --format table --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 grocery-compare-frontend:ci
