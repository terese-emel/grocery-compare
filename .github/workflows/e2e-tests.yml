name: End-to-end tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-real-stack-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        run: npm test
      - name: Start Docker stack
        run: docker compose up --build --detach
      - name: Wait for Docker stack
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health && curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1
      - name: Run real-stack Playwright test
        working-directory: e2e
        run: npm run test:real
      - name: Stop Docker stack
        if: always()
        run: docker compose down --volumes
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
